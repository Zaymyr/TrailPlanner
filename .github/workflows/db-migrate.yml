name: Supabase DB Migrate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Full commit SHA already merged into main"
        required: true
        type: string
      confirmation:
        description: "Type APPLY_PRODUCTION_MIGRATIONS to confirm"
        required: true
        type: string

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Validate production migration request
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PRODUCTION_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "APPLY_PRODUCTION_MIGRATIONS" ]; then
            echo "Production migrations were not explicitly confirmed."
            exit 1
          fi
          if [[ ! "$PRODUCTION_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "The production ref must be a full 40-character commit SHA."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "The requested ref must already be merged into main."
            exit 1
          fi

  verify:
    needs: validate
    uses: ./.github/workflows/db-verify.yml
    with:
      ref: ${{ inputs.ref }}
      base_sha: ${{ inputs.ref }}^

  migrate:
    needs: [validate, verify]
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          # Keep CI reproducible; upgrade deliberately after reviewing CLI changes.
          version: 2.108.0

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Check remote migration history
        id: migration_history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list 2>&1 | tee migration-list.txt

          python3 <<'PY'
          import pathlib
          import re
          import sys

          ansi = re.compile(r"\x1b\[[0-?]*[ -/]*[@-~]")
          output = ansi.sub("", pathlib.Path("migration-list.txt").read_text(encoding="utf-8"))
          local_versions = {
              path.name.split("_", 1)[0]
              for path in pathlib.Path("supabase/migrations").glob("*.sql")
          }
          listed_local_versions = set()
          remote_versions = set()

          for line in output.splitlines():
              columns = [column.strip() for column in re.split(r"[|│]", line)]
              if len(columns) < 2:
                  continue
              local = columns[0]
              remote = columns[1]
              if re.fullmatch(r"\d{14}", local):
                  listed_local_versions.add(local)
              if re.fullmatch(r"\d{14}", remote):
                  remote_versions.add(remote)

          unparsed_local = sorted(local_versions - listed_local_versions)
          if unparsed_local:
              print("::error::Could not reconcile the CLI migration list with repository files.")
              print("Local versions absent from parsed CLI output: " + ", ".join(unparsed_local))
              print("The CLI output format may have changed; refusing to deploy without a reliable drift check.")
              sys.exit(1)

          remote_only = sorted(remote_versions - local_versions)
          if remote_only:
              print("::error::Remote-only migration history detected. Deployment is blocked.")
              print("Remote-only versions: " + ", ".join(remote_only))
              print(
                  "Reconcile the schema and migration history in a reviewed change. "
                  "Do not run migration repair without verifying the actual remote schema."
              )
              sys.exit(1)

          pending_versions = sorted(local_versions - remote_versions)
          pending_paths = sorted(
              path
              for path in pathlib.Path("supabase/migrations").glob("*.sql")
              if path.name.split("_", 1)[0] in pending_versions
          )
          pathlib.Path("pending-migrations.txt").write_text(
              "".join(f"{path.as_posix()}\n" for path in pending_paths),
              encoding="utf-8",
          )
          print("Remote history contains no migration version missing from the repository.")
          if pending_paths:
              print("Pending migrations: " + ", ".join(path.name for path in pending_paths))
          else:
              print("No pending migrations.")
          PY

      - name: Validate every pending migration
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import pathlib
          import re
          import sys

          pending = [
              pathlib.Path(line.strip())
              for line in pathlib.Path("pending-migrations.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          errors = []
          create_table = re.compile(
              r"\bcreate\s+table\s+(?:if\s+not\s+exists\s+)?(?:public|\"public\")\."
              r"(?:\"([^\"]+)\"|([a-zA-Z_][a-zA-Z0-9_]*))",
              re.IGNORECASE,
          )

          def strip_comments(sql: str) -> str:
              sql = re.sub(r"/\*.*?\*/", " ", sql, flags=re.DOTALL)
              return re.sub(r"--[^\n]*", " ", sql)

          def qualified_table(name: str) -> str:
              return rf'(?:public|"public")\.(?:"{re.escape(name)}"|{re.escape(name)})'

          for path in pending:
              if not path.is_file():
                  errors.append(f"pending migration is missing: {path}")
                  continue
              sql = strip_comments(path.read_text(encoding="utf-8"))
              for match in create_table.finditer(sql):
                  table = match.group(1) or match.group(2)
                  table_ref = qualified_table(table)
                  if not re.search(
                      rf"\balter\s+table\s+(?:if\s+exists\s+)?(?:only\s+)?{table_ref}\s+enable\s+row\s+level\s+security\b",
                      sql,
                      re.IGNORECASE,
                  ):
                      errors.append(f"{path}: public.{table} is created without enabling RLS")

                  decisions = [
                      statement
                      for statement in sql.split(";")
                      if re.search(
                          rf"\b(?:grant|revoke)\b.*?\bon\s+(?:table\s+)?{table_ref}(?=\s|,|$)",
                          statement,
                          re.IGNORECASE | re.DOTALL,
                      )
                  ]
                  for role in ("anon", "authenticated", "service_role"):
                      if not any(re.search(rf"\b{role}\b", statement, re.IGNORECASE) for statement in decisions):
                          errors.append(f"{path}: public.{table} has no explicit GRANT/REVOKE decision for {role}")

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)
          print(f"Validated {len(pending)} pending migration(s) against the production history.")
          PY

      - name: Upload migration history diagnostic
        if: ${{ always() && steps.migration_history.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: supabase-migration-history-${{ github.run_id }}
          path: migration-list.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Preview pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --include-all --dry-run

      - name: Inspect database sessions
        env:
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
        run: |
          docker run --rm \
            -e SUPABASE_DB_URL_SESSION="$SUPABASE_DB_URL_SESSION" \
            postgres:17-alpine \
            sh -lc 'psql "$SUPABASE_DB_URL_SESSION" -v ON_ERROR_STOP=1 -c "
              SELECT now(), pid, usename, application_name, state,
                     wait_event_type, wait_event, xact_start, query_start
              FROM pg_stat_activity
              WHERE datname = current_database()
              ORDER BY state, usename;
            "'

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --include-all
