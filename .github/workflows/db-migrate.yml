name: Supabase DB Migrate

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/db-verify.yml
    with:
      base_sha: ${{ github.event.before }}

  migrate:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          # Keep CI reproducible; upgrade deliberately after reviewing CLI changes.
          version: 2.108.0

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Check remote migration history
        id: migration_history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list 2>&1 | tee migration-list.txt

          python3 <<'PY'
          import pathlib
          import re
          import sys

          ansi = re.compile(r"\x1b\[[0-?]*[ -/]*[@-~]")
          output = ansi.sub("", pathlib.Path("migration-list.txt").read_text(encoding="utf-8"))
          local_versions = {
              path.name.split("_", 1)[0]
              for path in pathlib.Path("supabase/migrations").glob("*.sql")
          }
          listed_local_versions = set()
          remote_versions = set()

          for line in output.splitlines():
              columns = [column.strip() for column in re.split(r"[|│]", line)]
              if len(columns) < 2:
                  continue
              local = columns[0]
              remote = columns[1]
              if re.fullmatch(r"\d{14}", local):
                  listed_local_versions.add(local)
              if re.fullmatch(r"\d{14}", remote):
                  remote_versions.add(remote)

          unparsed_local = sorted(local_versions - listed_local_versions)
          if unparsed_local:
              print("::error::Could not reconcile the CLI migration list with repository files.")
              print("Local versions absent from parsed CLI output: " + ", ".join(unparsed_local))
              print("The CLI output format may have changed; refusing to deploy without a reliable drift check.")
              sys.exit(1)

          remote_only = sorted(remote_versions - local_versions)
          if remote_only:
              print("::error::Remote-only migration history detected. Deployment is blocked.")
              print("Remote-only versions: " + ", ".join(remote_only))
              print(
                  "Reconcile the schema and migration history in a reviewed change. "
                  "Do not run migration repair without verifying the actual remote schema."
              )
              sys.exit(1)

          print("Remote history contains no migration version missing from the repository.")
          PY

      - name: Upload migration history diagnostic
        if: ${{ always() && steps.migration_history.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: supabase-migration-history-${{ github.run_id }}
          path: migration-list.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Preview pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --include-all --dry-run

      - name: Inspect database sessions
        env:
          SUPABASE_DB_URL_SESSION: ${{ secrets.SUPABASE_DB_URL_SESSION }}
        run: |
          docker run --rm \
            -e SUPABASE_DB_URL_SESSION="$SUPABASE_DB_URL_SESSION" \
            postgres:17-alpine \
            sh -lc 'psql "$SUPABASE_DB_URL_SESSION" -v ON_ERROR_STOP=1 -c "
              SELECT now(), pid, usename, application_name, state,
                     wait_event_type, wait_event, xact_start, query_start
              FROM pg_stat_activity
              WHERE datname = current_database()
              ORDER BY state, usename;
            "'

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db push --include-all
