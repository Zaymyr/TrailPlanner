name: EAS Submit Android Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Full commit SHA already merged into main"
        required: true
        type: string
      build_id:
        description: "EAS Android production build ID approved for rollout"
        required: true
        type: string
      confirmation:
        description: "Type PUBLISH_ANDROID_PRODUCTION to confirm"
        required: true
        type: string

concurrency:
  group: eas-submit-android-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  submit:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: Production
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Validate production submission
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PRODUCTION_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != "PUBLISH_ANDROID_PRODUCTION" ]; then
            echo "Android production submission was not explicitly confirmed."
            exit 1
          fi
          if [[ ! "$PRODUCTION_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "The production ref must be a full 40-character commit SHA."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "The requested ref must already be merged into main."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install EAS CLI
        run: npm install -g eas-cli@18.4.0

      - name: Verify approved build metadata
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_ID: ${{ inputs.build_id }}
          PRODUCTION_REF: ${{ inputs.ref }}
          EXPECTED_PROJECT_ID: c713a8a0-cd94-4f6e-9468-063c9c20da6c
          EXPECTED_APP_IDENTIFIER: com.paceyourself.app
        shell: bash
        run: |
          set -euo pipefail
          eas build:view "$EAS_BUILD_ID" --json --non-interactive > "$RUNNER_TEMP/eas-build.json"
          node <<'NODE'
          const fs = require('node:fs');

          const build = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/eas-build.json`, 'utf8'));
          const failures = [];
          const expect = (condition, message) => {
            if (!condition) failures.push(message);
          };

          expect(build.id === process.env.EAS_BUILD_ID, 'build id does not match the requested build');
          expect(build.status === 'FINISHED', `build status is ${build.status || 'missing'}, expected FINISHED`);
          expect(build.platform === 'ANDROID', `build platform is ${build.platform || 'missing'}, expected ANDROID`);
          expect(build.buildProfile === 'production', `build profile is ${build.buildProfile || 'missing'}, expected production`);
          expect(build.app?.id === process.env.EXPECTED_PROJECT_ID, 'build belongs to a different EAS project');
          expect(build.appIdentifier === process.env.EXPECTED_APP_IDENTIFIER, 'build uses a different Android application id');
          expect(
            String(build.gitCommitHash || '').toLowerCase() === process.env.PRODUCTION_REF.toLowerCase(),
            'build commit does not match the approved production ref',
          );
          expect(Boolean(build.artifacts?.applicationArchiveUrl), 'build has no application archive');
          expect(!build.expirationDate || Date.parse(build.expirationDate) > Date.now(), 'build artifact has expired');

          if (failures.length > 0) {
            for (const failure of failures) console.error(`::error::${failure}`);
            process.exit(1);
          }
          console.log('The EAS build metadata matches the approved commit and Android production application.');
          NODE

      - name: Submit approved Android build to production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_ID: ${{ inputs.build_id }}
        run: eas submit --platform android --id "$EAS_BUILD_ID" --profile production --non-interactive --wait
