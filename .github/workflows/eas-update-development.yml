name: EAS Update Development

on:
  push:
    branches:
      - 'dev/**'
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/eas-update-development.yml'
  workflow_dispatch:

concurrency:
  group: eas-update-development-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-development:
    runs-on: ubuntu-latest
    # EXPO_TOKEN is stored in this GitHub environment. The OTA itself targets
    # the separate EAS development environment and channel below.
    environment: Preview
    env:
      APP_VARIANT: development
      npm_config_fetch_retries: "5"
      npm_config_fetch_retry_factor: "2"
      npm_config_fetch_retry_mintimeout: "20000"
      npm_config_fetch_retry_maxtimeout: "120000"
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install EAS CLI
        run: npm install -g eas-cli@18.4.0

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci --legacy-peer-deps && exit 0
            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after $attempt attempts"
              exit 1
            fi
            echo "npm ci failed on attempt $attempt. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Expo version check
        run: npx expo install --check

      - name: Publish development OTA update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          OTA_MESSAGE: ${{ github.event.head_commit.message || 'Development OTA update' }}
        run: eas update --channel development --environment development --message "$OTA_MESSAGE" --non-interactive
