name: EAS Update Production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA already merged into main and validated in preview"
        required: true
        type: string
      confirmation:
        description: "Type PROMOTE_TO_PRODUCTION to confirm"
        required: true
        type: string

concurrency:
  group: eas-update-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-production:
    runs-on: ubuntu-latest
    environment: production
    env:
      npm_config_fetch_retries: "5"
      npm_config_fetch_retry_factor: "2"
      npm_config_fetch_retry_mintimeout: "20000"
      npm_config_fetch_retry_maxtimeout: "120000"
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Validate production promotion
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          PRODUCTION_REF: ${{ inputs.ref }}
        run: |
          if [ "$CONFIRMATION" != "PROMOTE_TO_PRODUCTION" ]; then
            echo "Production promotion was not explicitly confirmed."
            exit 1
          fi

          if [[ ! "$PRODUCTION_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "The production ref must be a full 40-character commit SHA."
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "The requested ref must already be merged into main."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install EAS CLI
        run: npm install -g eas-cli@18.4.0

      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            npm ci --legacy-peer-deps && exit 0
            if [ "$attempt" -eq 3 ]; then
              echo "npm ci failed after $attempt attempts"
              exit 1
            fi
            echo "npm ci failed on attempt $attempt. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Expo version check
        run: npx expo install --check

      - name: Publish production OTA update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          OTA_MESSAGE: Promote ${{ inputs.ref }} to production
        run: eas update --branch production --environment production --message "$OTA_MESSAGE" --non-interactive
