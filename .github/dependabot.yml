version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    # Expo SDK and native React Native packages must be upgraded together with
    # `npx expo install`, never as isolated Dependabot version bumps.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native*/*"
      - dependency-name: "babel-preset-expo"
      # supabase-js >=2.110 drops Node 20 support. Remove these bounds only
      # as part of the repository's future Node 22 migration.
      - dependency-name: "@supabase/supabase-js"
        versions:
          - ">=2.110.0"
      - dependency-name: "@supabase/ssr"
        versions:
          - ">=0.12.0"
    groups:
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
