appId: ${APP_ID || "com.paceyourself.app"}
name: Audit UX - navigation authentifiée
tags:
  - smoke
  - ux-audit
---
- runFlow:
    when:
      true: ${CLEAR_STATE !== "false"}
    commands:
      - launchApp:
          clearState: true
          permissions:
            notifications: deny
- runFlow:
    when:
      true: ${CLEAR_STATE === "false"}
    commands:
      - launchApp:
          stopApp: false
          permissions:
            notifications: deny
- runFlow:
    when:
      true: ${SKIP_DEEP_LINK !== "true"}
    commands:
      - openLink: paceyourself://login
- runFlow:
    when:
      true: ${SKIP_LOGIN !== "true"}
    commands:
      - extendedWaitUntil:
          visible:
            id: auth-login-email
          timeout: 30000
      - takeScreenshot: 01-login
      - tapOn:
          id: auth-login-email
      - inputText: ${MAESTRO_E2E_EMAIL}
      - tapOn:
          id: auth-login-password
      - inputText: ${MAESTRO_E2E_PASSWORD}
      - hideKeyboard
      - tapOn:
          id: auth-login-submit
- extendedWaitUntil:
    visible:
      id: nav-tab-catalog
    timeout: 60000
- runFlow:
    when:
      true: ${DISMISS_LOGBOX === "true"}
    commands:
      - tapOn:
          text: Dismiss
          optional: true
      - tapOn:
          text: Dismiss
          optional: true
      - tapOn:
          text: Dismiss
          optional: true
- tapOn:
    id: nav-tab-catalog
- waitForAnimationToEnd
- runFlow:
    when:
      true: ${DISMISS_LOGBOX === "true"}
    commands:
      - tapOn:
          text: Dismiss
          optional: true
      - tapOn:
          text: Dismiss
          optional: true
- takeScreenshot: 02-courses-top
- swipe:
    direction: UP
    duration: 500
- takeScreenshot: 03-courses-scroll
- tapOn:
    id: nav-tab-plans
- waitForAnimationToEnd
- runFlow:
    when:
      true: ${DISMISS_LOGBOX === "true"}
    commands:
      - tapOn:
          text: Dismiss
          optional: true
      - tapOn:
          text: Dismiss
          optional: true
- takeScreenshot: 04-plans-top
- swipe:
    direction: UP
    duration: 500
- takeScreenshot: 05-plans-scroll
- tapOn:
    id: nav-tab-nutrition
- waitForAnimationToEnd
- runFlow:
    when:
      true: ${DISMISS_LOGBOX === "true"}
    commands:
      - tapOn:
          text: Dismiss
          optional: true
      - tapOn:
          text: Dismiss
          optional: true
- takeScreenshot: 06-nutrition-top
- swipe:
    direction: UP
    duration: 500
- takeScreenshot: 07-nutrition-scroll
- tapOn:
    id: nav-tab-profile
- waitForAnimationToEnd
- runFlow:
    when:
      true: ${DISMISS_LOGBOX === "true"}
    commands:
      - tapOn:
          text: Dismiss
          optional: true
      - tapOn:
          text: Dismiss
          optional: true
- takeScreenshot: 08-profile-top
- swipe:
    direction: UP
    duration: 500
- takeScreenshot: 09-profile-scroll
