name: Build and submit mobile store candidates

on:
  push:
    branches: ['main']

jobs:
  approve_candidates:
    name: Prepare store candidates from main?
    if: ${{ github.ref_name == 'main' }}
    type: require-approval

  build_android:
    name: Build Android store candidate
    needs: [approve_candidates]
    type: build
    environment: production
    params:
      platform: android
      profile: production

  submit_android:
    name: Submit Android candidate to internal draft
    needs: [build_android]
    type: submit
    environment: production
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: store-candidate

  build_ios:
    name: Build iOS store candidate
    needs: [approve_candidates]
    type: build
    environment: production
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit iOS candidate to TestFlight
    needs: [build_ios]
    type: submit
    environment: production
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: store-candidate
