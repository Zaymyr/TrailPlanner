name: Mobile UX audit

jobs:
  build_android:
    name: Build Android E2E
    type: build
    environment: preview
    params:
      platform: android
      profile: e2e-test

  audit_android:
    name: Audit Android
    needs: [build_android]
    type: maestro
    environment: preview
    runs_on: linux-large-nested-virtualization
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      flow_path: .maestro/flows/authenticated-shell.yaml
      device_identifier: pixel_6
      record_screen: true
      retries: 1

  build_ios:
    name: Build iOS Simulator E2E
    type: build
    environment: preview
    params:
      platform: ios
      profile: e2e-test

  audit_ios:
    name: Audit iOS
    needs: [build_ios]
    type: maestro
    environment: preview
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      flow_path: .maestro/flows/authenticated-shell.yaml
      record_screen: true
      retries: 1
