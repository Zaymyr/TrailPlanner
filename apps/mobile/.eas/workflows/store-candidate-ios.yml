name: Build and submit iOS store candidate

on:
  workflow_dispatch: {}

jobs:
  approve_candidate:
    name: Prepare iOS store candidate from main?
    type: require-approval

  build_ios:
    name: Build iOS store candidate
    needs: [approve_candidate]
    type: build
    environment: production
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit iOS candidate to TestFlight
    needs: [build_ios]
    type: submit
    environment: production
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: store-candidate
